name: Set up Node.js
description: Sets up Node.js environment for the workflow.
inputs:
  node-version:
    description: 'The version of Node.js to set up'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Verify Node.js version
      shell: bash
      run: |
        echo "Node.js version:"
        node -v
        echo "npm version:"
        npm -v
