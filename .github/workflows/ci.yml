name: CI Workflow

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'

      - name: Run Greeting Action
        id: greet
        uses: ./.github/actions/greeting
        with:
          greetee: 'Elwood'

      - name: Output Greeting
        run: echo "${{ steps.greet.outputs.greeting }}"
